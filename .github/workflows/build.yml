name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest        # Windows head -> self-contained exe
            head: windows
            tfm: net10.0-windows
            rid: win-x64
          - os: macos-latest          # arm64 Apple Silicon runner -> .app bundle
            head: macos
            tfm: net10.0
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore -r ${{ matrix.rid }}

      # --- Windows head ---
      - name: Publish (Windows)
        if: matrix.head == 'windows'
        run: >
          dotnet publish MaplePet.csproj -f ${{ matrix.tfm }} -r ${{ matrix.rid }}
          -c Release --self-contained true -o artifacts/win
      - uses: actions/upload-artifact@v4
        if: matrix.head == 'windows'
        with:
          name: MaplePet-win-x64
          path: artifacts/win

      # --- macOS head -> .app bundle ---
      - name: Build .app bundle (icns + Info.plist + ad-hoc sign)
        if: matrix.head == 'macos'
        run: ./packaging/macos/build-macos-bundle.sh osx-arm64 Release
      - name: Zip bundle
        if: matrix.head == 'macos'
        run: ditto -c -k --keepParent artifacts/MaplePet.app artifacts/MaplePet-osx-arm64.zip
      - uses: actions/upload-artifact@v4
        if: matrix.head == 'macos'
        with:
          name: MaplePet-osx-arm64
          path: artifacts/MaplePet-osx-arm64.zip

  # NOTE: Notarization (Tier C) is intentionally NOT in this credential-free workflow. Add a separate,
  # tag-triggered release.yml that does Developer ID sign + `xcrun notarytool submit --wait` +
  # `xcrun stapler staple`, gated on the APPLE_ID / TEAM_ID / app-specific-password secrets being set.
